[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-core"
version = "0.1.0"
description = "Local-first shared runtime for the Auralith/Aegis development ecosystem."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0"
]

[project.scripts]
aegis = "aegis_core.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["aegis_core*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
