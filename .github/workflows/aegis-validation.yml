name: Aegis Validation

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - develop
      - codex/**
  workflow_dispatch:

jobs:
  core-tests:
    name: Aegis Core Tests
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: aegis-core
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Core
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Run Core tests
        run: python -m pytest tests -q

  website-backend:
    name: Website Backend Tests
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: website/backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path requirements.txt) { python -m pip install -r requirements.txt }
      - name: Run backend tests
        run: python -m pytest tests -q

  website-frontend:
    name: Website Frontend Tests And Build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: website/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: website/frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Build frontend
        run: npm run build

  contracts:
    name: Release And Evidence Contracts
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install contract dependencies
        run: |
          python -m pip install --upgrade pip
          if (Test-Path website/backend/requirements.txt) { python -m pip install -r website/backend/requirements.txt }
          if (Test-Path website/frontend/package-lock.json) {
            Push-Location website/frontend
            npm ci
            Pop-Location
          }
          if (Test-Path vscode-plugins/aegis-local-autopilot/package-lock.json) {
            Push-Location vscode-plugins/aegis-local-autopilot
            npm ci
            Pop-Location
          }
      - name: Run quality contract
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-quality-contract.ps1 -EvidenceDir .aegis\ci-contracts\quality-contract
      - name: Run observability CI contract
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-observability-ci.ps1 -EvidenceDir .aegis\ci-contracts\observability-ci-contract
      - name: Run memory governance contract
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-memory-governance.ps1 -EvidenceDir .aegis\ci-contracts\memory-governance-contract
      - name: Run plugin lifecycle contract
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-plugin-lifecycle.ps1 -EvidenceDir .aegis\ci-contracts\plugin-lifecycle-contract
      - name: Run evidence ledger contract
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-evidence-ledger-contract.ps1 -EvidenceDir .aegis\ci-contracts\evidence-ledger-contract

  desktop-release:
    name: Native Desktop Release Build
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run desktop source contract
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-desktop-contract.ps1
      - name: Build desktop release
        run: powershell -NoProfile -ExecutionPolicy Bypass -File build.ps1

  editor-extensions:
    name: Editor Extension Guards
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: vscode-plugins/aegis-local-autopilot/package-lock.json
      - name: Install VS Code extension dependencies
        working-directory: vscode-plugins/aegis-local-autopilot
        run: npm ci
      - name: Run VS Code unit tests
        working-directory: vscode-plugins/aegis-local-autopilot
        run: npm run test:unit
      - name: Run VS Code lint guards
        working-directory: vscode-plugins/aegis-local-autopilot
        run: npm run lint
      - name: Run Visual Studio validation guards
        run: powershell -NoProfile -ExecutionPolicy Bypass -File visual-studio-extensions\aegis-local-agent-vs\build.ps1 -ValidateOnly

  ecosystem-matrix:
    name: Full Ecosystem Matrix
    runs-on: windows-latest
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Run ecosystem validation
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\validate-ecosystem.ps1 -SkipSmoke
